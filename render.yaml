services:
  - type: web
    name: stitchhub-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: cd ../.. && pnpm install && pnpm --filter @stitchhub/api db:generate && pnpm --filter @stitchhub/api build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/subscriptions/plans
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://stitchhub-web.vercel.app

services:
  - type: web
    name: stitchhub-api
    runtime: node
    plan: free
    # Use repo root so the full monorepo (packages/shared) is available.
    rootDir: .
    buildCommand: corepack enable && pnpm install && pnpm build:api
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /api/v1/subscriptions/plans
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://stitchhub-web.vercel.app

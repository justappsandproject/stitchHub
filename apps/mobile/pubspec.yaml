name: stitchhub_mobile
description: StitchHub mobile app for customers, fashion designers, and platform admins.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7

  # Networking & DI
  dio: ^5.8.0+1
  get_it: ^8.0.3

  # Routing
  go_router: ^15.1.2

  # Storage & offline
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1

  # Push notifications
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^19.1.0

  # Payments
  webview_flutter: ^4.11.0
  url_launcher: ^6.3.1

  image_picker: ^1.1.2

  # UI & utils
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.1.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#312E81'
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
